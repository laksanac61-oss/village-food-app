name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-apk]
  pull_request:
    paths: [android/**, pubspec.yaml, .github/workflows/android.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=app/release.jks\nstorePassword=%s\nkeyAlias=bandung\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      # the build number grows with every run so a new APK installs over the old one
      - run: >
          flutter build apk --release --build-number=${{ github.run_number }}
          --target-platform android-arm,android-arm64
          --dart-define=SUPABASE_URL=https://lawwefqgureqmbtqkorl.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_qZm899EIz5VjQjWjnZAC2A_pTaDVjp5
      - run: mv build/app/outputs/flutter-apk/app-release.apk ban-dung.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ban-dung-apk
          path: ban-dung.apk
      # the latest APK also goes to the "apk" branch (one commit, replaced each time) so it can be fetched with git
      - name: Publish to the apk branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir publish && cp ban-dung.apk publish/ && cd publish
          printf 'Built from %s (run %s)\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > BUILD.txt
          git init -q -b apk && git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APK run $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
